services:
  postgres:
    image: postgres:15-alpine
    container_name: eduref_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: eduref_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - eduref_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./EDUREF_AI/backend
      dockerfile: Dockerfile
    container_name: eduref_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:root@postgres:5432/eduref_db?schema=public}"
      DIRECT_URL: "${DIRECT_URL:-postgresql://postgres:root@postgres:5432/eduref_db?schema=public}"
      # Bắt buộc tự đặt (vd: openssl rand -hex 32). Không có giá trị mặc định vì mọi giá trị
      # mặc định trong repo công khai đều cho phép người ngoài giả mạo token STAFF/DEAN.
      JWT_SECRET: "${JWT_SECRET:?Hay dat JWT_SECRET (openssl rand -hex 32) truoc khi chay docker compose}"
      ALLOW_DEMO_ROLE_SWITCH: "true"
      ALLOW_DESTRUCTIVE_SEED: "false"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-flash-lite-latest}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8080}"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./EDUREF_AI/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:5000/api}"
        VITE_SOCKET_URL: "${VITE_SOCKET_URL:-http://localhost:5000}"
    container_name: eduref_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  eduref_pgdata:
    name: eduref_pgdata
